services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  ollama-model:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama"]
    command: ["pull", "qwen2.5:0.5b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"

  gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      WARDEN_POLICIES_PATH: /config/policies.yaml
      WARDEN_OLLAMA_MODEL: ollama_chat/qwen2.5:0.5b
      WARDEN_OLLAMA_API_BASE: http://ollama:11434
      WARDEN_HOSTED_MODEL: ${WARDEN_HOSTED_MODEL:-openai/gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WARDEN_CANARY_TOKEN: ${WARDEN_CANARY_TOKEN:-warden-canary-never-disclose}
      WARDEN_ADMIN_API_KEY: ${WARDEN_ADMIN_API_KEY:-warden-demo-admin-key}
    volumes:
      - ./config:/config
    depends_on:
      ollama-model:
        condition: service_completed_successfully

volumes:
  ollama_data:
