services:
  gateway:
    build: .
    ports:
      - "8001:8000"
    environment:
      WARDEN_POLICIES_PATH: /config/policies.yaml
      WARDEN_OLLAMA_MODEL: ${WARDEN_OLLAMA_MODEL:-ollama_chat/qwen3.5:4b}
      WARDEN_OLLAMA_API_BASE: ${WARDEN_OLLAMA_API_BASE:-http://host.docker.internal:11434}
      INJECTION_MODE: ${INJECTION_MODE:-rules}
      WARDEN_CANARY_TOKEN: ${WARDEN_CANARY_TOKEN:-warden-canary-never-disclose}
      WARDEN_ADMIN_API_KEY: ${WARDEN_ADMIN_API_KEY:-warden-demo-admin-key}
      M4_API_BASE_URL: ${M4_API_BASE_URL:-http://host.docker.internal:8000}
    volumes:
      - ./config:/config
