services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hinderman}
      POSTGRES_USER: ${POSTGRES_USER:-hinderman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hinderman} -d ${POSTGRES_DB:-hinderman}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    entrypoint: ["uvicorn"]
    command: ["app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://hinderman:local-demo-only@db:5432/hinderman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?Set AUDIT_HMAC_KEY in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      APP_ENV: ${APP_ENV:-development}
      M2_BASE_URL: ${M2_BASE_URL:-}
      M2_SERVICE_TOKEN: ${M2_SERVICE_TOKEN:-}
      M2_DEPARTMENT_MAP: ${M2_DEPARTMENT_MAP:-}
      CHROMA_PATH: /data/chroma
      HF_HOME: /data/huggingface
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - chroma_data:/data/chroma
      - model_cache:/data/huggingface
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://host.docker.internal:8000
      WARDEN_URL: ${WARDEN_URL:-http://host.docker.internal:8001}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  chroma_data:
  model_cache:
